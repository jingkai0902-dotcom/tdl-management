# Merge these locations into the chosen existing server block when external access is needed.
# Stream-mode DingTalk callbacks do not require a public webhook.
# Internal write/debug/ops APIs should not be exposed through Nginx.

location = /tdl {
    return 301 /tdl/;
}

location = /tdl/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /tdl/entry {
    proxy_pass http://127.0.0.1:8010/entry;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /tdl/health {
    proxy_pass http://127.0.0.1:8010/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /tdl/calendar/auth/start {
    proxy_pass http://127.0.0.1:8010/calendar/auth/start;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /tdl/calendar/auth/callback {
    proxy_pass http://127.0.0.1:8010/calendar/auth/callback;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /tdl/ {
    return 403;
}
